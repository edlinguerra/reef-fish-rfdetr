name: reef-fish-rfdetr
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11.14
  - pytorch=2.9.1
  - cuda-version=12.8
  - numpy
  - pillow
  - pip
  - pip:
      - roboflow==1.2.11
      - rfdetr
      - pycocotools

# RF-DETR, NumPy, Pillow, and pycocotools are intentionally unpinned because
# their exact versions are not documented. This environment specification does
# not claim byte-identical recreation of the training build.

export_preprocessing:
  auto_orient: true
  static_crop:
    horizontal_percent: "0-100"
    vertical_percent: "0-92"
  resize:
    method: Fit
    width_px: 576
    height_px: 576
    padding: reflected_edges
  contrast_stretching: true
training_augmentation:
  outputs_per_source_image: 4
  horizontal_flip: true
  saturation_percent: "-15 to +15"
  brightness_percent: "-10 to +10"
  exposure_percent: "-5 to +5"
  noise_max_percent_of_pixels: 1
  operation_specific_probabilities_documented: false
validation_and_test_outputs_per_source_image: 1
detector_resolution_px: 448
